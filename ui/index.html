<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Search</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎯%3C/text%3E%3C/svg%3E">
<style>
  :root { --bg:#f6f6f3; --card:#fff; --text:#1c1c1a; --muted:#66665f; --line:#e2e2dc; --accent:#1f5fbf; --accent-text:#fff;
          --warn:#a04a00; --warn-bg:#fdf0d5; --ok:#17653a; --ok-bg:#dcf5e5; --off:#66665f; --off-bg:#ebebe6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161615; --card:#1f1f1d; --text:#ecece8; --muted:#a3a39c; --line:#35352f; --accent:#7fb0ff; --accent-text:#10213d;
            --warn:#fcd34d; --warn-bg:#453208; --ok:#86efac; --ok-bg:#0f3d22; --off:#a3a39c; --off-bg:#2a2a27; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding:14px 16px 0; max-width:1100px; margin:0 auto; }
  header h1 { font-size:20px; margin:0; }
  header .spacer { flex:1; }
  nav { display:flex; gap:4px; overflow-x:auto; padding:12px 16px 0; max-width:1100px; margin:0 auto; border-bottom:1px solid var(--line); }
  nav button { border:0; background:none; color:var(--muted); font:inherit; padding:8px 12px; cursor:pointer;
               border-bottom:2px solid transparent; white-space:nowrap; }
  nav button[aria-selected="true"] { color:var(--text); border-bottom-color:var(--accent); font-weight:600; }
  main { max-width:1100px; margin:0 auto; padding:20px 16px 60px; }
  h2 { font-size:17px; margin:26px 0 10px; } h2:first-child { margin-top:0; }
  h3 { font-size:15px; margin:18px 0 6px; }
  p { margin:0 0 10px; } .muted { color:var(--muted); } .small { font-size:13px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:14px; }
  .cards { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:14px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 16px; min-width:96px; }
  .stat b { display:block; font-size:24px; line-height:1.2; } .stat span { color:var(--muted); font-size:13px; }
  .wrap { overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:10px; margin-bottom:14px; }
  table { border-collapse:collapse; width:100%; }
  th, td { text-align:left; padding:8px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); white-space:nowrap; }
  th button.sort { all:unset; cursor:pointer; display:inline-flex; gap:6px; align-items:center; }
  th button.sort:hover, th[aria-sort="ascending"] button.sort, th[aria-sort="descending"] button.sort { color:var(--text); }
  th button.sort:focus-visible { outline:2px solid var(--accent); outline-offset:3px; border-radius:3px; }
  th button.sort .arrow { width:.8em; font-size:10px; }
  td.nowrap { white-space:nowrap; }
  tr:last-child td { border-bottom:0; } tr.closed td { color:var(--muted); }
  .pill { display:inline-block; padding:1px 9px; border-radius:99px; font-size:13px; white-space:nowrap; color:var(--ok); background:var(--ok-bg); }
  .pill.closed { color:var(--off); background:var(--off-bg); } .pill.warn { color:var(--warn); background:var(--warn-bg); }
  button.btn, select, input[type=number] { font:inherit; padding:7px 14px; border-radius:8px; border:1px solid var(--line);
               background:var(--card); color:var(--text); }
  button.btn { cursor:pointer; } button.btn.primary { background:var(--accent); color:var(--accent-text); border-color:var(--accent); font-weight:600; }
  button.btn:disabled { opacity:.5; cursor:default; }
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  a { color:var(--accent); }
  .roles { display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:8px; margin-bottom:12px; }
  .roles label { display:flex; gap:8px; align-items:center; padding:10px 12px; border:1px solid var(--line); border-radius:8px; cursor:pointer; background:var(--card); }
  .roles label:has(input:checked) { border-color:var(--accent); }
  .check { list-style:none; padding:0; margin:0; } .check li { display:flex; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); }
  .check li:last-child { border-bottom:0; } .check .mark { width:22px; text-align:center; font-weight:700; color:var(--muted); }
  .check li.done .mark { color:var(--ok); } .check li.done .text { color:var(--muted); }
  .notice { padding:10px 14px; border-radius:8px; background:var(--warn-bg); color:var(--warn); margin:10px 0; }
  .notice.ok { background:var(--ok-bg); color:var(--ok); }
  #banner { max-width:1100px; margin:0 auto; padding:0 16px; } #banner .notice { margin:14px 0 0; display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .split { display:grid; grid-template-columns:220px 1fr; gap:16px; align-items:start; }
  @media (max-width: 720px) { .split { grid-template-columns:1fr; } }
  .list { display:flex; flex-direction:column; gap:4px; }
  .list button { text-align:left; border:1px solid transparent; background:none; color:var(--text); font:inherit; padding:7px 10px; border-radius:8px; cursor:pointer; }
  .list button:hover { background:var(--card); } .list button[aria-current="true"] { background:var(--card); border-color:var(--line); font-weight:600; }
  .doc { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px 22px; min-height:120px; overflow-wrap:anywhere; }
  .doc h1 { font-size:20px; margin:0 0 8px; } .doc h2 { font-size:16px; margin:20px 0 8px; } .doc ul { padding-left:20px; margin:0 0 10px; }
  .doc .wrap { border-radius:8px; } .doc code, .kw { font-family:ui-monospace, Menlo, Consolas, monospace; font-size:13px; background:var(--off-bg); padding:1px 6px; border-radius:5px; }
  .tabs { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px; }
  pre { white-space:pre-wrap; margin:0; font:13px/1.5 ui-monospace, Menlo, Consolas, monospace; }
  .kwlist { display:grid; grid-template-columns:max-content 1fr auto; gap:6px 14px; align-items:center; }
  @media (max-width: 720px) { .kwlist { grid-template-columns:1fr auto; } .kwlist .about { grid-column:1 / -1; margin-top:-4px; } }
</style>
</head>
<body>
<header>
  <h1>Job Search</h1>
  <span class="pill closed" id="role-badge">loading</span>
  <span class="spacer"></span>
  <span class="muted small" id="sync" aria-live="polite"></span>
  <button class="btn" id="example-toggle" hidden>See an example</button>
  <button class="btn" id="refresh">Refresh</button>
</header>
<nav role="tablist" aria-label="Sections" id="nav"></nav>
<div id="banner"></div>
<main id="main" role="tabpanel" tabindex="-1"><p class="muted">Loading…</p></main>

<script>
const TOKEN = "__TOKEN__";
const TABS = [["start", "Start"], ["pipeline", "Pipeline"], ["applications", "Applications"],
              ["prep", "Prep"], ["progress", "Progress"], ["tools", "Tools"]];
let state = null;                      // server state
let ui = { tab: location.hash.slice(1) || "start", company: null, file: null, doc: null, hideClosed: false, example: false,
           paper: "letter", source: "", days: "30",
           results: { master: null, archive: null, apps: {} } };   // kept here so a redraw does not erase them

function el(tag, props = {}, ...kids) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props)) {
    if (value == null || value === false) continue;
    if (key === "class") node.className = value;
    else if (key === "html") node.innerHTML = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value === true ? "" : value);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    node.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  if (/(^| )notice( |$)/.test(node.className) && !props.role) node.setAttribute("role", "status");
  return node;
}

// In example mode every read asks for the fictional candidate, and nothing can be changed.
function withMode(path) { return ui.example ? path + (path.includes("?") ? "&" : "?") + "example=1" : path; }

async function api(path, body) {
  if (body && ui.example) throw new Error("Not available while viewing the example. Go back to your data first.");
  path = withMode(path);
  const options = body ? { method: "POST", headers: { "Content-Type": "application/json", "X-Token": TOKEN }, body: JSON.stringify(body) } : {};
  const response = await fetch(path, options);
  const data = await response.json();
  if (!response.ok) throw Object.assign(new Error(data.error || response.statusText), { fromServer: true });
  return data;
}

function copyButton(text) {
  const button = el("button", { class: "btn small", onclick: async () => {
    try { await navigator.clipboard.writeText(text); button.textContent = "Copied"; }
    catch { button.textContent = "Select and copy"; }
    setTimeout(() => { button.textContent = "Copy"; }, 1500);
  } }, "Copy");
  return button;
}

function table(headers, rows, rowClass) {
  return el("div", { class: "wrap" }, el("table", {},
    el("thead", {}, el("tr", {}, headers.map(h => el("th", {}, h)))),
    el("tbody", {}, rows.map((cells, i) => el("tr", { class: rowClass ? rowClass(i) : null }, cells.map(c => el("td", {}, c)))))));
}

function stagePill(row) { return el("span", { class: "pill" + (row.closed ? " closed" : "") }, row.stage || "no stage"); }

/* ---------- Start ---------- */
let draftRoles = null;             // unsaved edits to the role list
function onboardingBox(prompt) {
  const cdCommand = 'cd "' + state.folder + '"';
  const path = el("span", { class: "kw", style: "overflow-wrap:anywhere" }, state.folder);
  return el("div", { class: "card", style: "margin-top:12px" },
    el("h3", { style: "margin-top:0" }, "Step 1. Get an AI tool, if you do not have one"),
    el("p", { class: "muted small" }, "You need one that can read and change the files in this folder. A chat app in a browser cannot. ",
      el("b", {}, "Cursor"), " is the easiest to start with: download it from ", el("a", { href: "https://cursor.com", target: "_blank", rel: "noopener" }, "cursor.com"),
      ", install it and sign in. Codex and Claude Code also work. These tools usually need a paid plan."),
    el("h3", {}, "Step 2. Open this project folder in it"),
    el("p", { class: "muted small" }, "The AI can only help if it is opened on this folder, because that is where your files are. On this computer the folder is:"),
    el("div", { class: "row" }, path, copyButton(state.folder)),
    el("ul", { class: "muted small", style: "margin:0 0 6px; padding-left:20px" },
      el("li", {}, el("b", {}, "Cursor: "), "choose File, then Open Folder, and pick the folder above. To paste the path instead of browsing: on a Mac press Cmd+Shift+G in the folder window; on Windows paste it into the address bar. Then open the chat panel (Cmd+L, or Ctrl+L on Windows) and set it to Agent."),
      el("li", {}, el("b", {}, "Codex or Claude Code: "), "open a terminal, run the line below, then run ", el("span", { class: "kw" }, "codex"), " or ", el("span", { class: "kw" }, "claude"), ".")),
    el("div", { class: "row" }, el("span", { class: "kw", style: "overflow-wrap:anywhere" }, cdCommand), copyButton(cdCommand)),
    el("h3", {}, "Step 3. Paste this as your first message"),
    el("pre", { id: "prompt-text", tabindex: "0" }, prompt),
    el("div", { class: "row", style: "margin:10px 0 0" }, copyButton(prompt)),
    el("p", { class: "muted small", style: "margin:10px 0 0" }, "The AI then asks you questions, one at a time. Answer them there. This page updates by itself as each step is saved."));
}
function viewStart() {
  if (draftRoles === null) draftRoles = state.roles.slice();
  const changed = JSON.stringify(draftRoles) !== JSON.stringify(state.roles);
  const input = el("input", { type: "text", id: "role-input", maxlength: "60", placeholder: "e.g. Frontend Engineer",
    "aria-label": "Add a role", style: "flex:1; min-width:200px; font:inherit; padding:7px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text)",
    onkeydown: e => { if (e.key === "Enter") add(); } });
  const message = el("div");
  function add() {
    const text = input.value.replace(/\s+/g, " ").trim();
    if (!text) return;
    if (!draftRoles.some(r => r.toLowerCase() === text.toLowerCase())) draftRoles.push(text);
    render(); document.querySelector("#role-input")?.focus();
  }
  async function save() {
    try {
      const result = await api("/api/roles", { roles: draftRoles });
      draftRoles = null; await load();
      document.querySelector("#role-msg")?.append(el("div", { class: "notice ok" }, result.roles.length
        ? "Saved. If you have already finished setup, type roles in your AI tool so it adjusts your profile, practice and rubric to: " + result.roles.join(", ") + "."
        : "Saved. You have no target roles yet."));
    } catch (error) { message.replaceChildren(el("div", { class: "notice" }, error.message)); }
  }
  const done = state.setup.filter(s => s.done).length;
  const step = id => state.setup.find(x => x.id === id)?.done;
  const finished = ["resume", "tailored", "audit", "applied"].every(step);      // all seven onboarding steps are behind them
  const started = ["resume", "tailored", "audit", "applied"].some(step);
  const prompt = finished
    ? ["Read AGENTS.md, then run the `check in` keyword by following modes/check-in.md.",
       "When you have updated any files, tell me so I can look at the dashboard."].join("\n")
    : ["Read AGENTS.md, then run the `setup` keyword by following modes/setup.md one step at a time.",
       started ? "Some steps are already done. Check the files first and carry on from the first unfinished step." : "",
       "",
       state.roles.length ? "My target roles are already saved in profile/roles.md: " + state.roles.join(", ") + "."
                          : "I have not chosen my target roles yet. Ask me which job titles I am applying for (there may be several) and save them to profile/roles.md.",
       step("source") ? "My resume source is already in the profile/ folder."
                      : "I have not saved my LinkedIn export yet. Start by telling me exactly how to get it and where to put it, then wait for me.",
       "",
       "Take me through the steps by asking me questions, one at a time, and wait for each answer. Do not invent anything about me.",
       "After each step, save the files and tell me to look at the dashboard, which updates by itself. At the end, tell me what to type next."]
      .filter((line, i, all) => line !== "" || all[i - 1] !== "").join("\n");
  const label = finished ? "Get today's prompt" : started ? "Continue onboarding" : "Start project onboarding";
  return [
    ui.example ? el("div", { class: "card" },
      el("p", {}, "This is Sam Rivera, a fictional product manager about seven weeks into a search. Look through the tabs to see what a working project holds: a pipeline with follow-ups due, tailored applications, company research, interview stories and practice scores."),
      el("p", { class: "muted small" }, "Nothing here can be changed, and none of it is mixed with your own files.")) : null,
    ui.example ? null : el("h2", {}, finished ? "Start today's session" : "Start here"),
    ui.example ? null : el("div", { class: "card" },
      el("p", {}, "This page shows your job search. The work itself is a conversation with an AI tool that reads and updates the files in this folder."),
      el("p", {}, finished
        ? "You are set up. This button gives you the message that starts today's planning session."
        : "Setup is an interview that takes 60 to 90 minutes, and you can stop and carry on later. It covers your target roles, your resume, the basics, a check of your claims, and your first application. This button gives you the first message to send."),
      el("div", { class: "row" },
        el("button", { class: "btn primary", id: "onboarding-toggle", "aria-expanded": String(!!ui.showPrompt), onclick: () => { ui.showPrompt = !ui.showPrompt; render(); } },
          ui.showPrompt ? "Hide the instructions" : label),
        state.has_example && !started ? el("button", { class: "btn", onclick: toggleExample }, "See an example first") : null),
      ui.showPrompt ? onboardingBox(prompt) : null),
    el("h2", {}, `Setup progress (${done} of ${state.setup.length})`),
    el("div", { class: "card" }, el("ul", { class: "check" }, state.setup.map(item =>
      el("li", { class: item.done ? "done" : null },
        el("span", { class: "mark", "aria-hidden": "true" }, item.done ? "✓" : "○"),
        el("div", {}, el("div", { class: "text" }, item.text, el("span", { class: "muted" }, item.done ? " (done)" : " (to do)")),
          !item.done && el("div", { class: "muted small" }, item.hint)))))),
    el("h2", {}, "Your target roles"),
    el("div", { class: "card" },
      el("p", { class: "muted" }, ui.example ? "The job titles this candidate is applying for." :
        "The job titles you are applying for, in your own words. Add as many as you are really targeting. You can leave this empty: onboarding asks you. Your AI tool uses them to shape your profile, practice exercises and screening rubric, and you can keep a resume version for each."),
      draftRoles.length
        ? el("div", { class: "row" }, draftRoles.map((r, i) => el("span", { class: "pill" + (i ? " closed" : "") }, r, i ? "" : " (primary)", " ",
            ui.example ? null : el("button", { "aria-label": "Remove " + r, style: "border:0; background:none; color:inherit; cursor:pointer; font:inherit; padding:0 0 0 4px",
              onclick: () => { draftRoles.splice(i, 1); render(); } }, "×"))))
        : el("p", { class: "muted small" }, "No roles yet."),
      ui.example ? null : el("div", { class: "row" }, input, el("button", { class: "btn", onclick: add }, "Add"),
        el("button", { class: "btn primary", disabled: !changed, onclick: save }, "Save roles")),
      changed ? el("p", { class: "muted small" }, "You have unsaved changes.") : null,
      message, el("div", { id: "role-msg" }))
  ];
}

/* ---------- Pipeline ---------- */
const PIPELINE_COLUMNS = [["company", "Company"], ["role", "Role"], ["stage", "Stage"], ["applied", "Applied"],
  ["last contact", "Last contact"], ["next action", "Next action"], ["due", "Due"], ["flag", "Attention"]];

// Rows in the order chosen by clicking a column heading. With no choice, the order the dashboard computed
// (by stage, then due date) is kept. Empty cells always go last, whichever direction is chosen.
function sortedRows(rows) {
  const sort = ui.sort;
  if (!sort) return rows;
  const stageRank = {};                                 // stages in pipeline order, taken from the default row order
  state.pipeline.rows.forEach((r, i) => { if (!(r.stage in stageRank)) stageRank[r.stage] = i; });
  const value = r => sort.key === "stage" ? stageRank[r.stage]
    : sort.key === "flag" ? (r.flag ? -(parseInt(r.flag.replace(/\D+/g, ""), 10) || 0) : "")   // longest wait first
    : (r[sort.key] || "");
  const direction = sort.descending ? -1 : 1;
  return rows.map((row, index) => ({ row, index })).sort((a, b) => {
    const x = value(a.row), y = value(b.row);
    if (x === "" || y === "") return (x === "" ? 1 : 0) - (y === "" ? 1 : 0) || a.index - b.index;
    const order = typeof x === "number" ? x - y : String(x).localeCompare(String(y), undefined, { numeric: true, sensitivity: "base" });
    return order * direction || a.index - b.index;
  }).map(entry => entry.row);
}
function pipelineTable(rows, sortable) {
  const cycle = key => {                                // first click ascending, second descending, third back to the default order
    ui.sort = ui.sort?.key !== key ? { key, descending: false } : ui.sort.descending ? null : { key, descending: true };
    render();
  };
  const heading = ([key, label]) => {
    if (!sortable) return el("th", {}, label);
    const active = ui.sort?.key === key;
    return el("th", { "aria-sort": active ? (ui.sort.descending ? "descending" : "ascending") : "none" },
      el("button", { class: "sort", id: "sort-" + key.replace(/ /g, "-"), title: "Sort by " + label.toLowerCase(), onclick: () => cycle(key) },
        label, el("span", { class: "arrow", "aria-hidden": "true" }, active ? (ui.sort.descending ? "▼" : "▲") : "")));
  };
  const shown = sortable ? sortedRows(rows) : rows;
  return el("div", { class: "wrap" }, el("table", {},
    el("thead", {}, el("tr", {}, PIPELINE_COLUMNS.map(heading))),
    el("tbody", {}, shown.map(r => el("tr", { class: r.closed ? "closed" : null },
      el("td", {}, el("b", {}, r.company)), el("td", {}, r.role), el("td", {}, stagePill(r)),
      el("td", { class: "nowrap" }, r.applied), el("td", { class: "nowrap" }, r["last contact"]),
      el("td", {}, r["next action"]), el("td", { class: "nowrap" }, r.due),
      el("td", {}, r.flag ? el("span", { class: "pill warn" }, r.flag) : ""))))));
}
function viewPipeline() {
  const p = state.pipeline;
  if (!p.rows.length) return [el("div", { class: "card" }, el("p", {}, "No applications yet."),
    el("p", { class: "muted" }, "Type ", el("span", { class: "kw" }, "apply: [company]"), " in your AI tool and paste a posting. It will show up here."),
    p.problems.map(x => el("div", { class: "notice" }, x)))];
  const flagged = p.rows.filter(r => r.flag);
  const shown = ui.hideClosed ? p.rows.filter(r => !r.closed) : p.rows;
  return [
    el("div", { class: "cards" },
      el("div", { class: "stat" }, el("b", {}, p.rows.length), el("span", {}, "Total")),
      el("div", { class: "stat" }, el("b", {}, p.rows.filter(r => !r.closed).length), el("span", {}, "Active")),
      p.counts.map(([stage, n]) => el("div", { class: "stat" }, el("b", {}, n), el("span", {}, stage)))),
    flagged.length ? [el("h2", {}, `Needs attention (${flagged.length})`), pipelineTable(flagged, false)] : null,
    p.problems.length ? el("div", { class: "notice" }, el("b", {}, "Rows to fix in applications/PIPELINE.md"),
      el("ul", {}, p.problems.map(x => el("li", {}, x)))) : null,
    el("h2", {}, "All applications"),
    el("div", { class: "row" }, el("label", {}, el("input", { type: "checkbox", checked: ui.hideClosed,
      onchange: e => { ui.hideClosed = e.target.checked; render(); } }), " Hide closed"),
      el("span", { class: "muted small" }, ui.sort ? "Sorted by " + PIPELINE_COLUMNS.find(c => c[0] === ui.sort.key)[1].toLowerCase() + (ui.sort.descending ? ", descending" : ", ascending") + ". Click the heading again to change it."
                                                    : "Click a column heading to sort.")),
    pipelineTable(shown, true)
  ];
}

/* ---------- document reader shared by Applications and Prep ---------- */
const docCache = new Map();        // path -> last html shown, so a refresh does not flash or jump
function docPane(path, section) {
  const pane = el("div", { class: "doc" });
  const show = d => pane.replaceChildren(el("div", { html: d.html || "<p class='muted'>This file is empty.</p>" }),
                                         el("p", { class: "muted small" }, d.path));
  if (docCache.has(path)) show(docCache.get(path)); else pane.append(el("p", { class: "muted" }, "Loading…"));
  api("/api/file?path=" + encodeURIComponent(path) + (section ? "&section=" + encodeURIComponent(section) : ""))
    .then(d => { const old = docCache.get(path); docCache.set(path, d); if (!old || old.html !== d.html) show(d); })
    .catch(error => { docCache.delete(path); pane.replaceChildren(el("p", { class: "muted" }, error.message)); });
  return pane;
}

/* ---------- resume export, shared by Applications and Tools ---------- */
function exportNotice(result) {
  if (!result) return null;
  if (result.pending) return el("p", { class: "muted" }, "Exporting…");
  if (result.error) return el("div", { class: "notice" }, result.error);
  const file = result.pdf || result.html;
  return el("div", { class: "notice ok" }, "Exported. ",
    el("a", { href: "/" + file, target: "_blank", rel: "noopener" }, result.pdf ? "Open PDF" : "Open HTML"),
    result.pdf ? "" : " (no PDF: " + result.failure + ". Open the HTML and use Print, then Save as PDF.)");
}
async function runExport(company, body) {          // company is null for the master resume or a role version
  const results = ui.results;      // switching to the example replaces ui.results, so a late answer cannot leak into it
  const store = result => { if (company) results.apps[company] = result; else results.master = result; if (results === ui.results) render(); };
  store({ pending: true });
  try { store(await api("/api/export", body)); } catch (error) { store({ error: error.message }); }
}

/* ---------- Applications ---------- */
function viewApplications() {
  const apps = state.applications;
  if (!apps.length) return [el("div", { class: "card" }, el("p", {}, "No company folders yet."),
    el("p", { class: "muted" }, "Each ", el("span", { class: "kw" }, "apply: [company]"), " creates one with the posting, your fit, the tailored resume and interview notes."))];
  const app = apps.find(a => a.name === ui.company) || apps[0];
  const file = app.files.includes(ui.file) ? ui.file : (app.files.includes("fit.md") ? "fit.md" : app.files[0]);
  const slug = text => text.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  const row = state.pipeline.rows.find(r => slug(r.company) === slug(app.name));
  return [el("div", { class: "split" },
    el("div", { class: "list", role: "group", "aria-label": "Companies" }, apps.map(a =>
      el("button", { "aria-current": a.name === app.name ? "true" : null, onclick: () => { ui.company = a.name; ui.file = null; render(); } }, a.name))),
    el("div", {},
      el("div", { class: "row" }, el("h2", { style: "margin:0" }, app.name), row ? stagePill(row) : null,
        row && row.flag ? el("span", { class: "pill warn" }, row.flag) : null),
      row ? el("p", { class: "muted" }, [row.role, row["next action"] && "Next: " + row["next action"], row.due && "due " + row.due].filter(Boolean).join(" · ")) : null,
      el("div", { class: "row" },
        app.files.includes("resume.md") ? el("button", { class: "btn", disabled: ui.example || ui.results.apps[app.name]?.pending,
          title: ui.example ? "Turned off in the example" : null,
          onclick: () => runExport(app.name, { company: app.name, paper: ui.paper }) }, "Export resume to PDF") : null,
        app.pdf ? el("a", { href: "/" + app.pdf, target: "_blank", rel: "noopener" }, "Open last exported PDF") : null),
      exportNotice(ui.results.apps[app.name]),
      app.files.length ? el("div", { class: "tabs" }, app.files.map(f =>
        el("button", { class: "btn" + (f === file ? " primary" : ""), "aria-pressed": String(f === file), onclick: () => { ui.file = f; render(); } }, f.replace(/\.md$/, "")))) : el("p", { class: "muted" }, "This folder has no files yet."),
      file ? docPane(`applications/${app.name}/${file}`) : null))];
}

/* ---------- Stories (inside Prep) ---------- */
function storiesPane() {
  const { items, coverage } = state.stories;
  const missing = coverage.filter(c => !c.titles.length);
  return el("div", {},
    el("p", { class: "muted" }, "Your interview stories in STAR form: Situation, Task, Action, Result. Read them here; practise by saying them aloud. Build one with ",
      el("span", { class: "kw" }, "story"), " in your AI tool."),
    el("h3", {}, `Questions covered: ${coverage.length - missing.length} of ${coverage.length}`),
    table(["Question", "Your story"], coverage.map(c => [
      el("span", {}, c.question, " ", el("span", { class: "muted small" }, "(" + c.tag + ")")),
      c.titles.length ? c.titles.join(", ") : el("span", { class: "pill warn" }, "no story yet")])),
    items.length ? items.map(story => el("div", { class: "doc", style: "margin-bottom:12px" },
        el("div", { class: "row" },
          story.competencies.map(tag => el("span", { class: "pill" }, tag)),
          el("span", { class: "pill closed" }, story.minutes + " min spoken"),
          story.practised ? el("span", { class: "pill closed" }, "practised " + story.practised) : null,
          story.flags.map(flag => el("span", { class: "pill warn" }, flag))),
        el("div", { html: story.html })))
      : el("div", { class: "card muted" }, "No stories yet."));
}

/* ---------- Prep ---------- */
function viewPrep() {
  const docs = state.prep.concat([{ title: `Stories (${state.stories.items.length})`, path: "#stories", ready: true }],
    state.questions.length ? [{ title: "Questions I was asked", path: "#questions", ready: true }] : []);
  const current = docs.find(d => d.path === ui.doc) || docs[0];
  if (!current) return [el("div", { class: "card" }, "Nothing to read yet.")];
  ui.showTemplate = ui.showTemplate || {};
  const waiting = !current.ready && !ui.showTemplate[current.path];
  const body = current.path === "#questions"
    ? el("div", { class: "doc" }, state.questions.map(q => [el("h1", {}, q.company), el("div", { html: q.html })]))
    : current.path === "#stories" ? storiesPane()
    : waiting ? el("div", { class: "doc" },
        el("h1", {}, current.title), el("p", {}, current.about),
        el("p", { class: "muted" }, "Nothing here yet. It fills in as you work with your AI tool."),
        el("button", { class: "btn", onclick: () => { ui.showTemplate[current.path] = true; render(); } }, "Show the blank template"))
    : docPane(current.path, current.ready ? current.section : "");
  return [el("p", { class: "muted" }, "Your own material, to read before an interview. To change any of it, edit the file or ask your AI tool."),
    el("div", { class: "split" },
      el("div", { class: "list", role: "group", "aria-label": "Documents" }, docs.map(d =>
        el("button", { "aria-current": d.path === current.path ? "true" : null, onclick: () => { ui.doc = d.path; render(); } },
          d.title, d.ready ? "" : el("span", { class: "muted small" }, " (empty)")))),
      body)];
}

/* ---------- Progress ---------- */
function viewProgress() {
  const practice = state.practice, totals = state.progress;
  const scores = practice.map(p => parseFloat(p.score)).filter(n => !isNaN(n));
  const average = list => list.length ? (list.reduce((a, b) => a + b, 0) / list.length).toFixed(1) : "–";
  return [
    el("div", { class: "cards" },
      el("div", { class: "stat" }, el("b", {}, totals.applied), el("span", {}, "Applications sent")),
      el("div", { class: "stat" }, el("b", {}, totals.interviews), el("span", {}, "Interviews reached")),
      el("div", { class: "stat" }, el("b", {}, totals.offers), el("span", {}, "Offers")),
      el("div", { class: "stat" }, el("b", {}, state.stories.coverage.filter(c => c.titles.length).length + "/" + state.stories.coverage.length), el("span", {}, "Questions with a story")),
      el("div", { class: "stat" }, el("b", {}, practice.length), el("span", {}, "Practice sessions")),
      el("div", { class: "stat" }, el("b", {}, average(scores.slice(0, 5))), el("span", {}, "Avg score, last 5")),
      el("div", { class: "stat" }, el("b", {}, average(scores)), el("span", {}, "Avg score, all"))),
    el("h2", {}, "Practice sessions"),
    practice.length
      ? table(["Date", "Mode", "Topic", "Score", "Weakest point"], practice.map(p => [p.date, p.mode, p.topic, p.score, p["weakest point"]]))
      : el("div", { class: "card muted" }, "None logged yet. Each ", el("span", { class: "kw" }, "drill"), ", ", el("span", { class: "kw" }, "practice"), ", story practice and ", el("span", { class: "kw" }, "mock interview"), " adds a line here."),
    el("h2", {}, "Recent sessions"),
    state.log.length ? state.log.map(entry => el("div", { class: "doc", style: "margin-bottom:10px", html: entry.html }))
                 : el("div", { class: "card muted" }, "No daily-log entries yet. Your AI tool writes one at the end of each session.")
  ];
}

/* ---------- Tools ---------- */
const GLOSSARY = [
  ["Keyword", "A word or phrase you type to your AI tool, such as check in. Each one runs a fixed set of steps."],
  ["Pipeline", "The list of every job you have applied to, and the stage each one is at."],
  ["Stage", "Where an application stands: Drafted, Applied, Screen (first call), Interview, Final, Offer, or closed as Rejected, Withdrawn or No reply."],
  ["Master resume", "Your full resume, with every claim checked. Every other version is made from it."],
  ["Role version", "A copy of the master resume arranged for one kind of job you are targeting."],
  ["Fit", "A side-by-side check of what a posting requires against what you can show evidence for."],
  ["Screening rubric", "Your own rules for deciding in two minutes whether a posting is worth applying to."],
  ["Gap", "A skill that real postings or interviews showed you are missing. Gaps are ranked by how often they come up."],
  ["Story", "A real example from your work, told as Situation, Task, Action, Result (STAR), for questions like \"tell me about a time you...\""],
  ["Archive", "Moving old log entries and closed applications into a separate file, so the everyday files stay short."]
];
async function runArchive(apply) {
  // Applying always uses the number of days that was previewed, never whatever is in the box now.
  const days = apply ? ui.results.archive.days : ui.days;
  const results = ui.results;
  try { results.archive = await api("/api/archive", { days, apply }); }
  catch (error) { results.archive = { error: error.message }; }
  const archive = results.archive;
  if (archive.days) ui.days = String(archive.days);     // the server keeps days within 1 to 3650; show what it used
  ui.previewOpen = !!archive.report && !archive.applied && archive.moved > 0;   // holds auto-refresh until applied or dismissed
  if (apply && !archive.error) await load(); else if (results === ui.results) render();
}
function viewTools() {
  const option = (value, label, current) => el("option", { value, selected: value === current }, label);
  const source = el("select", { "aria-label": "Which resume", onchange: e => { ui.source = e.target.value; } },
    option("", "Master resume", ui.source), state.versions.map(v => option(v, "Version: " + v, ui.source)));
  const paper = el("select", { "aria-label": "Paper size", onchange: e => { ui.paper = e.target.value; } },
    option("letter", "US Letter", ui.paper), option("a4", "A4", ui.paper));
  const archive = ui.results.archive;
  const previewed = !!archive?.report && !archive.applied;
  const matchesPreview = () => previewed && archive.days === parseInt(ui.days, 10);
  const archiveNote = () => !archive?.report ? ""
    : archive.applied ? "Done. These were moved."
    : !archive.moved ? "Nothing to archive."
    : matchesPreview() ? "Preview for " + archive.days + " days. Nothing has changed yet."
    : "You changed the number of days. Press Preview again before archiving.";
  const archiveButton = el("button", { class: "btn", disabled: !(matchesPreview() && archive.moved > 0), onclick: () => runArchive(true) }, "Archive now");
  const note = el("p", { class: "muted small", style: "margin-top:8px", role: "status" }, archiveNote());
  // Typing in the box updates the button and the note in place. Redrawing here would swallow a click on Preview.
  const days = el("input", { type: "number", min: "1", max: "3650", value: ui.days, style: "width:90px", "aria-label": "Days to keep",
    oninput: e => { ui.days = e.target.value; archiveButton.disabled = !(matchesPreview() && archive.moved > 0); note.textContent = archiveNote(); } });
  const off = ui.example ? "Turned off in the example" : null;
  return [
    ui.example ? el("p", { class: "muted" }, "The buttons on this tab are turned off while you look at the example.") : null,
    el("h2", {}, "Export a resume"),
    el("div", { class: "card" }, el("div", { class: "row" }, source, paper,
        el("button", { class: "btn primary", disabled: ui.example || ui.results.master?.pending, title: off,
          onclick: () => runExport(null, { paper: ui.paper, role: ui.source }) }, "Export to PDF")),
      el("p", { class: "muted small" }, "The master resume or a role version. Resumes tailored to one company are exported from the Applications tab, using the paper size chosen here."),
      exportNotice(ui.results.master)),
    el("h2", {}, "Archive old entries"),
    el("div", { class: "card" }, el("div", { class: "row" }, "Keep the last", days, "days",
        el("button", { class: "btn primary", disabled: ui.example, title: off, onclick: () => runArchive(false) }, "Preview"),
        archiveButton),
      el("p", { class: "muted small" }, "Moves older daily-log entries and closed applications into _archive folders. Preview first."),
      archive?.error ? el("div", { class: "notice" }, archive.error) : null,
      archive?.report ? el("div", { class: "card" }, el("pre", {}, archive.report.join("\n")), note) : null),
    el("h2", {}, "Keywords for your AI tool"),
    el("div", { class: "card" }, el("div", { class: "kwlist" }, state.keywords.map(([keyword, about]) => [
      el("span", {}, el("span", { class: "kw" }, keyword)), el("span", { class: "about muted" }, about), copyButton(keyword.replace(/: \[.*\]$/, ": "))]))),
    el("h2", {}, "What the words mean"),
    el("div", { class: "card" }, el("dl", { style: "margin:0" }, GLOSSARY.map(([term, meaning]) => [
      el("dt", { style: "font-weight:600; margin-top:8px" }, term), el("dd", { class: "muted", style: "margin:0" }, meaning)]))),
    el("h2", {}, "Scripts for the terminal"),
    state.scripts.map(script => el("div", { class: "card" }, el("b", {}, script.name), el("span", { class: "muted" }, "  " + script.summary),
      el("pre", { style: "margin-top:8px" }, script.commands.map(([command, about]) => command + (about ? "   # " + about : "")).join("\n"))))
  ];
}

const VIEWS = { start: viewStart, pipeline: viewPipeline, applications: viewApplications, prep: viewPrep, progress: viewProgress, tools: viewTools };

// A short description of the focused control, so focus can be put back after the page is redrawn.
function focusKey(node) {
  if (!node || !node.getAttribute || node === document.body) return null;
  if (node.id) return "#" + node.id;
  return [node.tagName, node.getAttribute("aria-label") || "", node.getAttribute("role") || "", (node.textContent || "").trim().slice(0, 60)].join("|");
}
function selectTab(id, focus) {
  if (id !== ui.tab) {                                  // an unapplied archive preview does not follow you to another tab
    if (ui.results.archive && !ui.results.archive.applied) ui.results.archive = null;
    ui.previewOpen = false;
  }
  ui.tab = id;
  history.replaceState(null, "", "#" + id);
  render();
  if (focus) document.querySelector("#tab-" + id)?.focus();
}
function render() {
  if (!state) return;                                   // nothing to draw while disconnected
  if (!VIEWS[ui.tab]) ui.tab = "start";
  const focusable = () => [...document.querySelectorAll("button, a[href], input, select, [tabindex]")];
  const focused = focusKey(document.activeElement);
  // Several controls can share a label ("Copy"), so remember which of them had focus.
  const nth = focused ? focusable().filter(n => focusKey(n) === focused).indexOf(document.activeElement) : -1;
  const ids = TABS.map(([id]) => id);
  document.querySelector("#nav").replaceChildren(...TABS.map(([id, label], i) =>
    el("button", { role: "tab", id: "tab-" + id, "aria-controls": "main", "aria-selected": String(id === ui.tab),
      tabindex: id === ui.tab ? "0" : "-1", onclick: () => selectTab(id),
      onkeydown: e => {
        const move = { ArrowRight: 1, ArrowLeft: -1 }[e.key];
        const target = e.key === "Home" ? 0 : e.key === "End" ? ids.length - 1 : move ? (i + move + ids.length) % ids.length : null;
        if (target !== null) { e.preventDefault(); selectTab(ids[target], true); }
      } }, label)));
  document.querySelector("#role-badge").textContent = state.roles.length ? state.roles.join(" · ") : "No roles yet";
  const toggle = document.querySelector("#example-toggle");
  toggle.hidden = !state.has_example;
  toggle.textContent = ui.example ? "Back to my data" : "See an example";
  document.querySelector("#banner").replaceChildren(...(ui.example ? [el("div", { class: "notice", role: "status" },
    el("b", {}, "Example data."), " A fictional candidate, shown as of " + state.as_of + ". Read-only.",
    el("button", { class: "btn", onclick: toggleExample }, "Back to my data"))] : []));
  const main = document.querySelector("#main");
  main.setAttribute("aria-labelledby", "tab-" + ui.tab);
  main.replaceChildren(...VIEWS[ui.tab]().flat(3).filter(Boolean));
  if (focused && nth >= 0) {                            // the redraw replaced the focused control; put focus on its successor
    const matches = focusable().filter(n => focusKey(n) === focused);
    const match = matches[nth] || matches[0] || main;   // if the control is gone, stay inside the panel rather than falling to the top
    if (match !== document.activeElement) match.focus({ preventScroll: true });
  }
}

async function toggleExample() {
  ui.example = !ui.example;
  Object.assign(ui, { company: null, file: null, doc: null, showPrompt: false, previewOpen: false,
                      results: { master: null, archive: null, apps: {} } });
  draftRoles = null; docCache.clear(); state = null;
  await load();
  window.scrollTo(0, 0);
}

function rolesDirty() { return !!(!ui.example && draftRoles && state && JSON.stringify(draftRoles) !== JSON.stringify(state.roles)); }

async function load() {
  try {
    const next = await api("/api/state");
    if (!rolesDirty()) draftRoles = null;       // pick up a role list changed outside the page
    state = next;
    const y = window.scrollY;
    render();
    window.scrollTo(0, y);
    setSync("Up to date · " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }));
  } catch (error) {
    state = null;
    document.querySelector("#main").replaceChildren(el("div", { class: "notice" }, error.fromServer
      ? "The dashboard is running but hit a problem reading your files: " + error.message + ". Fix or restore that file, or ask your AI tool to, then press Refresh."
      : "The dashboard is not running. Start it again by double-clicking the launcher in the start folder, then press Refresh."));
    setSync(error.fromServer ? "Problem reading files" : "Disconnected");
  }
}

/* ---------- automatic refresh ---------- */
function setSync(text) { document.querySelector("#sync").textContent = text; }

// Reasons not to redraw under the user: unsaved roles, typing in a field, or an archive preview waiting.
function pauseReason() {
  if (rolesDirty()) return "unsaved roles";
  if (ui.previewOpen) return "archive preview open";
  const active = document.activeElement;
  if (active && ["INPUT", "SELECT", "TEXTAREA"].includes(active.tagName) && active.type !== "checkbox") return "you are typing";
  return "";
}

let checking = false;
async function checkForChanges() {
  if (document.hidden || checking) return;
  checking = true;
  try {
    const response = await fetch(withMode("/api/version"));
    const { version } = await response.json();
    if (!state) await load();                                   // reconnect after the dashboard was restarted
    else if (version !== state.version) {
      const reason = pauseReason();
      if (reason) setSync("New changes, paused (" + reason + ")");
      else await load();
    }
  } catch { setSync("Disconnected"); }
  checking = false;
}
setInterval(checkForChanges, 4000);
document.addEventListener("visibilitychange", checkForChanges);
window.addEventListener("focus", checkForChanges);

document.querySelector("#refresh").addEventListener("click", () => {
  if (ui.results.archive && !ui.results.archive.applied) ui.results.archive = null;   // a manual refresh dismisses an open preview
  ui.previewOpen = false;
  load();
});
document.querySelector("#example-toggle").addEventListener("click", toggleExample);
load();
</script>
</body>
</html>
